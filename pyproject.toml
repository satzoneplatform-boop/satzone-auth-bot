[project]
name = "satzone-bot"
version = "0.1.0"
description = "SAT Zone — Telegram bot (aiogram v3): links phone↔chat_id↔user and relays OTP codes"
requires-python = ">=3.13"
readme = "README.md"

dependencies = [
    # ---- Telegram bot framework ----
    "aiogram>=3.13,<4",

    # ---- HTTP (aiohttp powers aiogram + the internal OTP-push server; httpx is the API client) ----
    "aiohttp>=3.10",
    "httpx>=0.27",

    # ---- Settings & validation ----
    "pydantic-settings>=2.6,<3",

    # ---- Observability ----
    "structlog>=24.4",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py313"
src = ["app"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "C4", "SIM", "RUF"]
# S105 fires on header-name string constants (e.g. "X-Internal-Secret"), which
# are not secrets — the actual secret comes from settings. Matches the backend.
ignore = ["S105"]

[tool.mypy]
python_version = "3.13"
plugins = ["pydantic.mypy"]
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true
